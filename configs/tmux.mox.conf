# ~/.tmux.conf — native Mox; no TPM


# -----------------------------------------------------------------------------
# CORE TERMINAL / SERVER SETTINGS
# -----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB'
set -as terminal-features ',kitty:RGB'
set -ga terminal-overrides ',xterm-kitty:Tc'


set -s escape-time 0
set -g focus-events on
set -g mouse on
set -g set-clipboard on
set -g history-limit 200000
set -g repeat-time 300
set -g display-time 3000
set -g renumber-windows on
set -g detach-on-destroy off
setw -g allow-rename off
setw -g mode-keys vi
set -g status-position top
set -g base-index 1
setw -g pane-base-index 1

# -----------------------------------------------------------------------------
# PREFIX / GENERAL UX
# -----------------------------------------------------------------------------
unbind C-Space
set -g prefix C-Space
bind-key C-Space send-prefix

# Better reload / redraw
unbind r
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
bind R refresh-client -S

# Keep current path when creating windows
bind c new-window -c '#{pane_current_path}'
bind C new-window -c '#{pane_current_path}'

# -----------------------------------------------------------------------------
# SMART SPLITS / NAVIGATION
# -----------------------------------------------------------------------------
unbind g
bind g display-panes

# Current layout helper from your config
bind s split-window -h -p 30 -c '#{pane_current_path}' \; split-window -v -c '#{pane_current_path}'

# Pane navigation (your custom layout preserved)
unbind d
bind -r d select-pane -L
unbind n
bind -r n select-pane -R
unbind t
bind -r t select-pane -U
unbind h
bind -r h select-pane -D

# Extra ergonomic splits
unbind _
bind _ split-window -h -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind \\ split-window -v -c '#{pane_current_path}'

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z

# Quick window/session movement
bind -r Tab last-window
bind -r C-h previous-window
bind -r C-l next-window

# -----------------------------------------------------------------------------
# COPY MODE / TEXT WORKFLOW
# -----------------------------------------------------------------------------
bind Enter copy-mode
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X copy-end-of-line-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi / command-prompt -p 'search down' 'send -X search-forward "%%%"'
bind -T copy-mode-vi ? command-prompt -p 'search up' 'send -X search-backward "%%%"'

# -----------------------------------------------------------------------------
# PERSONAL POPUPS
# -----------------------------------------------------------------------------
bind p display-popup -E -w 90% -h 90% -d '#{pane_current_path}' "$SHELL"
bind G run-shell -b '$HOME/.cargo/bin/mox lazygit'
bind x run-shell -b '$HOME/.cargo/bin/mox extract --launch-popup'
bind ';' run-shell -b '$HOME/.cargo/bin/mox flash --mode quick-yank --launch-popup'
bind j run-shell -b '$HOME/.cargo/bin/mox flash --launch-popup'

# -----------------------------------------------------------------------------
# NORD STATUS / PERSONAL APPEARANCE
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
set -g status-interval 5
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 180

set -g status-style 'fg=#d8dee9,bg=#2e3440'
set -g message-style 'fg=#2e3440,bg=#88c0d0,bold'
set -g message-command-style 'fg=#2e3440,bg=#ebcb8b,bold'
set -g mode-style 'fg=#88c0d0,bg=#3b4252,bold'
set -g popup-style 'fg=#eceff4,bg=#2e3440'
set -g popup-border-style 'fg=#81a1c1,bg=default'
set -g menu-style 'fg=#d8dee9,bg=#3b4252'
set -g menu-selected-style 'fg=#2e3440,bg=#88c0d0,bold'
set -g clock-mode-colour '#88c0d0'
set -g display-panes-colour '#4c566a'
set -g display-panes-active-colour '#88c0d0'
set -g pane-border-style 'fg=#4c566a,bg=default'
set -g pane-active-border-style 'fg=#88c0d0,bg=default'

setw -g window-status-separator ' '
setw -g window-status-style 'fg=#7b88a1,bg=#2e3440'
setw -g window-status-format '#[fg=#7b88a1,bg=#2e3440] #I:#W#{?window_flags,#{window_flags},} '
setw -g window-status-current-style 'fg=#2e3440,bg=#88c0d0,bold'
setw -g window-status-current-format '#[fg=#2e3440,bg=#88c0d0,bold] #I:#W#{?window_flags,#{window_flags},} '
setw -g window-status-activity-style 'fg=#ebcb8b,bg=#2e3440,bold'
setw -g window-status-bell-style 'fg=#bf616a,bg=#2e3440,bold'

set -g status-left '#[fg=#2e3440,bg=#88c0d0,bold] #S #[fg=#88c0d0,bg=#2e3440]│#[default]'
set -g status-right '#(neoamp tmux --track-width 36)'

# -----------------------------------------------------------------------------
# MOX — install bindings after personal settings
# -----------------------------------------------------------------------------
# M-m: modal; ?: hints; M-z: suspend/resume; C-h/j/k/l: smart navigation.
# Prefix Space/o/f/C-f/Slash/N: palette/projects/files/git/rg/LazyGit.
# Prefix C-s/C-r: save/restore sessions. Autosave defaults to 900 seconds.
run-shell '$HOME/.cargo/bin/mox init --apply'
